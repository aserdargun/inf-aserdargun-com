name: Deploy INF to Azure Static Web Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-inf-aserdargun-com-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Activate locked pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium prerequisites
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate CI release
        run: pnpm validate:ci

      - name: Verify deployment contract
        run: pnpm deployment:verify

      - name: Verify prebuilt artifacts
        run: |
          test -d out
          test -d api-dist
          pnpm artifact:verify

      - name: Deploy prebuilt artifacts
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SWA_INF_ASERDARGUN_COM }}
          action: upload
          app_location: out
          api_location: api-dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true
